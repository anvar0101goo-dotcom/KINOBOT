<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}

/* WATER */
.water{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:62vmax;height:62vmax;filter:blur(64px);opacity:.55;animation:mo 16s ease-in-out infinite alternate;border-radius:42% 58% 63% 37%/45% 38% 62% 55%;will-change:transform}

.wave{position:absolute;left:0;bottom:0;width:200%;height:36vh;opacity:var(--wo);animation:wv 14s linear infinite;will-change:transform}
.wave.w2{opacity:calc(var(--wo)*.6);animation-duration:22s;animation-direction:reverse;height:30vh}
@keyframes wv{to{transform:translateX(-50%)}}
.bub{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(140,210,255,.12) 60%,transparent 70%);border:1px solid rgba(255,255,255,.25);animation:bubu linear infinite;opacity:0}
@keyframes bubu{10%{opacity:.8}to{transform:translate(var(--dx),-112vh);opacity:0}}

.aur{position:absolute;inset:-30%;background:conic-gradient(from 0deg at 50% 60%,rgba(0,200,255,0),rgba(0,200,255,.3),rgba(122,140,255,0) 35%,rgba(160,110,255,.26) 55%,rgba(0,180,255,0) 75%,rgba(60,255,220,.2) 90%,rgba(0,200,255,0));filter:blur(70px) hue-rotate(var(--hr));animation:spin 45s linear infinite;mix-blend-mode:screen;opacity:var(--ao);will-change:transform}
.par{position:absolute;inset:0;transform:translate3d(calc(var(--px,0)*-16px),calc(var(--py,0)*-16px),0);transition:transform .6s ease-out}
.rays{position:absolute;left:-25%;right:-25%;top:-10%;height:80%;background:repeating-conic-gradient(from 200deg at 50% 0,rgba(160,220,255,.17) 0 5deg,transparent 5deg 13deg);-webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%);opacity:var(--ro);filter:blur(10px) hue-rotate(var(--hr));transform-origin:50% 0;animation:sway 12s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

.caus{position:absolute;inset:0;opacity:.16;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(180,235,255,.7),transparent) 0 0/180px 120px,radial-gradient(closest-side,rgba(140,200,255,.6),transparent) 60px 40px/130px 90px;animation:cau 20s linear infinite;-webkit-mask:linear-gradient(transparent,#000 50%);mask:linear-gradient(transparent,#000 50%)}
@keyframes cau{to{background-position:180px 120px,-70px 130px}}

.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wave path{fill:var(--v1)}.w2 path{fill:var(--v2)}#stars{opacity:var(--so)}
:root{--w:radial-gradient(120% 80% at 50% -10%,#0d2a7a 0%,#06174a 42%,#030c22 78%);--b1:#1f5dff;--b2:#00b4ff;--b3:#9a6bff;--v1:#2f6bff;--v2:#00b4ff;--hr:0deg;--ao:.7;--ro:1;--wo:.5;--so:1}
body[data-bg=kosmos]{--w:radial-gradient(110% 80% at 70% 0%,#32106e 0%,#14063f 45%,#04010e 85%);--b1:#6a2bff;--b2:#ff3da6;--b3:#00d0ff;--hr:80deg;--ao:.9;--ro:0;--wo:0;--so:1;--ac:#c58bff}

.sun{position:absolute;left:50%;bottom:20%;width:50vmin;height:50vmin;margin-left:-25vmin;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,#ffd27a 30%,rgba(255,140,90,.5) 52%,transparent 70%);animation:sunp 8s ease-in-out infinite alternate}

.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 55%,rgba(120,200,255,.1));backdrop-filter:blur(26px) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.08);border:1px solid var(--bd);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1.5px 1px rgba(255,255,255,.12),inset 0 0 22px rgba(110,190,255,.14),0 14px 36px rgba(0,12,50,.38)}

@keyframes sw{to{transform:translateX(8%) translateY(-8px)}}
@keyframes sh{60%,100%{transform:translateX(120%)}}
.poster span{position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));animation:fy 5s ease-in-out infinite}
.meta{padding:10px 12px 12px;font-size:12px}.meta b{display:block;font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{color:var(--mut)}
.tag{position:absolute;top:9px;left:9px;font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;background:linear-gradient(120deg,var(--gold),#ff9a5c);color:#2a1a00;z-index:2}
.rt{position:absolute;top:9px;right:9px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;z-index:2}

.search:focus{transform:scale(1.015);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),0 0 0 3px rgba(92,196,255,.5),0 14px 36px rgba(0,12,50,.38)}
.search::placeholder{color:var(--mut)}
/* TABS */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);height:72px;border-radius:36px;padding:6px;z-index:20;animation:tin .9s var(--sp) backwards .2s}

.tin{position:relative;display:flex;height:100%}

.lens.sq{animation:sq .6s var(--sp)}
@keyframes sq{40%{scale:1.16 .86}}
.tb{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10px Sora,sans-serif;color:var(--mut);border:0;background:none;cursor:pointer;transition:color .3s}

.ov{position:fixed;inset:0;z-index:40;background:rgba(0,8,30,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s;display:flex;align-items:flex-end;justify-content:center}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;border-radius:34px 34px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .6s var(--sp);scrollbar-width:none;overscroll-behavior:contain}

.prof{text-align:center}
.avw{position:relative;width:118px;height:118px;margin:6px auto 14px}

/* tab bar bir marta quriladi, shuning uchun "linza" silliq suzadi */
function tabs(){const b=$("tabs");if(!b.firstChild)b.innerHTML=`<div class="tin"><div class="lens" id="lens"></div>${T.map(([k,l])=>`<button class="tb" data-k="${k}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join("")}</div>`;
const i=Math.max(0,T.findIndex(x=>x[0]==S.tab)),L=$("lens");L.style.transform=`translateX(${i*100}%)`;L.classList.remove("sq");void L.offsetWidth;L.classList.add("sq");b.querySelectorAll(".tb").forEach(x=>x.classList.toggle("on",x.dataset.k==S.tab))}
function applyS(){document.body.dataset.bg=S.bg;document.body.classList.toggle("noanim",!S.anim)}
async function sync(){if(!(tg&&tg.initData))return;try{const r=await fetch("/api/vip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.msg||"Profilni sinxronlab bo'lmadi");const was=S.vip;S.vip=!!j.vip;S.vipTs=j.until||0;S.vipTill=j.vip?new Date(j.until*1000).toLocaleDateString("uz-UZ"):"";save();if(S.vip!=was){if(S.vip){sWin();confetti();toast("VIP faollashdi! 👑")}render()}}catch(e){console.error("VIP sync failed:",e)}}
function openSet(){sOpen();setH();showO()}
function tgl(k){S[k]=!S[k];applyS();save();tone(520,.08,"triangle");hap();const el=document.querySelector(`[data-k="${k}"] .sw`);if(el)el.classList.toggle("on",S[k])}
function setBg(k){S.bg=k;applyS();save();sTap();document.querySelectorAll("#sheet [data-bg]").forEach(c=>c.classList.toggle("on",c.dataset.bg==k))}
function setQ(q){if(q.startsWith("4K")&&!S.vip){toast("4K faqat VIP uchun 👑");return}S.q=q;save();sTap();document.querySelectorAll("#sheet [data-q]").forEach(c=>c.classList.toggle("on",c.dataset.q==q))}
function setH(){const sw=(k,l)=>`<div class="li" data-k="${k}" onclick="tgl('${k}')">${l}<div class="sw ${S[k]?'on':''}"></div></div>`;
$("sheet").innerHTML=`<div class="grab"></div><h2 style="font-size:23px;margin:0 0 12px">⚙️ Sozlamalar</h2><div class="set glass">${sw('snd','🔊 Tovushlar')}<div class="li">🎚 Balandlik<input type="range" min="0" max="100" value="${S.vol}" oninput="S.vol=+this.value" onchange="save();tone(660,.15)" style="width:50%;accent-color:var(--ac)"></div>${sw('anim','✨ Animatsiyalar')}${sw('hapt','📳 Titrash')}${sw('notif','🔔 Bildirishnomalar')}</div>
<h2>Orqa fon</h2><div class="chips">${[['kosmos','🌌 Kosmos'],['shafaq','🌅 Shafaq'],['kinozal','🎬 Kinozal'],['okean','🌊 Okean']].map(([k,l])=>`<div class="chip glass ${S.bg==k?'on':''}" data-bg="${k}" onclick="setBg(this.dataset.bg)">${l}</div>`).join("")}</div>
<h2>Video sifati</h2><div class="chips">${['Avto','720p','1080p','4K 👑'].map(q=>`<div class="chip glass ${S.q==q?'on':''}" data-q="${q}" onclick="setQ(this.dataset.q)">${q}</div>`).join("")}</div>
<div class="set glass" style="margin-top:18px"><div class="li" onclick="toast('Til: O\\'zbekcha 🇺🇿')">🌐 Til<span style="color:var(--mut)">O'zbekcha</span></div><div class="li" style="color:#ff7a8a" onclick="try{localStorage.removeItem('cz')}catch(e){};location.reload()">🗑 Ma'lumotlarni tozalash</div></div><p style="text-align:center;color:var(--mut);font-size:11px;margin-top:14px">🍿 CINEZEN v2.1</p>`}
async function loadConfig(){if(!(tg&&tg.initData))return;try{const r=await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});const j=await r.json();if(!r.ok||!j.ok)throw new Error("Tariflarni yuklab bo'lmadi");if(j.bot)BOT=j.bot;if(!!j.admin!==ISADM){ISADM=!!j.admin;prof()}if(Array.isArray(j.plans)&&j.plans.length){P=j.plans.map(p=>({k:p.k,n:p.n,p:p.p+" ⭐️",s:p.rec?"🔄 avto-to'lov • har oy":"bir martalik to'lov"}));if(!P.some(p=>p.k==S.plan))S.plan=P[0].k;if(!S.vip&&S.tab=="vip")vipRe();else if(!S.vip)$("s-vip").innerHTML=vipH()}}catch(e){console.error("Plan loading failed:",e);toast("Tariflarni yuklab bo'lmadi")}}
async function loadM(){if(!(tg&&tg.initData)){LD=false;return}try{const r=await fetch("/api/movies",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});const j=await r.json();const full=t=>{document.body.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;background:#050f26;font:600 18px system-ui">'+t+'</div>'};if(r.status==403||j.banned)return full("🚫 Kirish cheklangan");if(j.maint)return full("🛠 Texnik ishlar ketmoqda.<br>Tez orada qaytamiz!");if(!r.ok||!j.ok||!Array.isArray(j.movies))throw new Error(j.msg||"Kinolarni yuklab bo'lmadi");M=j.movies;LD=false;render()}catch(e){LD=false;console.error("Movie loading failed:",e);toast("Kinolarni yuklab bo'lmadi");render()}}
/* qayta chizishda scroll joyi saqlanadi */
function render(){const sc=document.querySelector(".scr.on"),y=sc?sc.scrollTop:0,q=($("q")||{}).value||"";applyS();home();(document.activeElement&&document.activeElement.id=="q")?sres(q):search(q);vipRe();prof();tabs();if(sc)sc.scrollTop=y}
render();loadConfig();loadM();sync();document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadConfig();sync();loadM()}});setInterval(sync,30000);
</script></body></html>
